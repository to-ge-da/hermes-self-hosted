# mise.toml — local toolchain (workstation / clone)
#
# Default `mise install` at the repo root. First-boot on a Debian
# host uses mise.host.toml via `./scripts/mise.sh install` instead
# (mise -E host, this file ignored).
#
# Host pins (yq) live only in mise.host.toml.
#
# See docs/MISE.md

[tools]
shellcheck = "0.11.0"
