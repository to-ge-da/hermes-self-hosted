name: shellcheck

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/shellcheck.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb569eb20110df3091ab23318 # v2.0.0
        with:
          scandir: scripts
          severity: warning
